services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${APP_NAME:-Levita}
    container_name: levita-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    volumes:
      - ./.env:/var/www/html/.env
      - levita_storage:/var/www/html/storage
      # Mantém chunks Vite antigos entre deploys (HTML/JS em cache nos celulares).
      - levita_build:/var/www/html/public/build
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - levita

  mysql:
    image: mysql:8.0
    container_name: levita-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-levita}
      MYSQL_USER: ${DB_USERNAME:-levita}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - levita_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - levita

volumes:
  levita_mysql:
  levita_storage:
  levita_build:

networks:
  levita:
    driver: bridge
